<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebDAV Backup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Red+Hat+Display:wght@600;700&family=Reddit+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>
        <span class="material-symbols-outlined" style="margin-right:8px;font-size:22px">cloud_upload</span>
        WebDAV Backup
      </h1>
      <div class="server">
        <span id="server-status" class="badge">Loading…</span>
        <span id="encryption-badge" class="badge" hidden></span>
        <button id="check-btn" type="button">
          <span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">verified</span>
          Test connection
        </button>
        <button id="theme-toggle" type="button" title="Toggle theme">
          <span class="material-symbols-outlined" style="font-size:20px">dark_mode</span>
        </button>
      </div>
    </header>

    <p id="error" class="error" role="alert" hidden></p>

    <main class="layout">
      <section class="panel">
        <h2>
          <span class="material-symbols-outlined" style="margin-right:6px;font-size:18px">folder_open</span>
          Browse folders
        </h2>
        <div class="crumbs">
          <button id="up-btn" type="button" title="Go to parent folder">
            <span class="material-symbols-outlined" style="font-size:16px;margin-right:2px">arrow_upward</span>
            Up
          </button>
          <code id="current-path">Drives</code>
        </div>
        <button id="add-folder-btn" type="button" disabled>+ Add to backup</button>
        <ul id="dir-list" class="list"></ul>
      </section>

      <section class="panel">
        <h2>
          <span class="material-symbols-outlined" style="margin-right:6px;font-size:18px">shield</span>
          Selected for backup
        </h2>
        <ul id="selected-list" class="list"></ul>
        <p id="selected-empty" class="muted">Tick folders on the left to add them.</p>
        <button id="backup-btn" class="primary" type="button" disabled>
          <span class="material-symbols-outlined" style="margin-right:6px;font-size:18px">backup</span>
          Back up now
        </button>

        <div id="job" class="job" hidden>
          <div class="progress"><div id="progress-bar"></div></div>
          <p id="job-summary"></p>
          <ul id="job-failures" class="failures"></ul>
        </div>
      </section>
    </main>

    <section class="schedules-section">
      <div class="schedules-header">
        <h2>Scheduled Backups</h2>
        <button id="new-schedule-btn" type="button">+ New Schedule</button>
      </div>
      <div id="schedule-list"></div>

      <div id="schedule-form" hidden>
        <h3 id="schedule-form-title">New Schedule</h3>
        <label>Name <input id="sched-name" type="text" maxlength="200" placeholder="My daily backup" /></label>
        <label>Time <input id="sched-time" type="time" /></label>
        <label>Recurrence
          <select id="sched-recurrence">
            <option value="once">Once</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </label>
        <div id="sched-days-group" class="days-group" hidden>
          <label><input type="checkbox" value="0" /> Sun</label>
          <label><input type="checkbox" value="1" /> Mon</label>
          <label><input type="checkbox" value="2" /> Tue</label>
          <label><input type="checkbox" value="3" /> Wed</label>
          <label><input type="checkbox" value="4" /> Thu</label>
          <label><input type="checkbox" value="5" /> Fri</label>
          <label><input type="checkbox" value="6" /> Sat</label>
        </div>
        <div class="sched-paths">
          <h4>Folders to back up</h4>
          <ul id="sched-path-list" class="list"></ul>
          <button id="sched-add-path-btn" type="button">+ Add current folder</button>
        </div>
        <div class="schedule-form-actions">
          <button id="sched-save-btn" type="button" class="primary">Save</button>
          <button id="sched-cancel-btn" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <script>
      (function() {
        try {
          var t = localStorage.getItem('vaultline-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
